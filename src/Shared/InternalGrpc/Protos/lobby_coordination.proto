syntax = "proto3";

package mgo2.internal.v1;

option csharp_namespace = "Mgo2Server.Shared.InternalGrpc.Contracts";

// The channel between the HTTP API and every gameplay lobby. It is hosted by
// the HTTP API and opened by the lobby, which is the side that knows the
// server-to-server endpoint. One call carries both directions: the lobby sends
// its presence events down the request stream, the API sends the announcements
// it has to relay down the response stream.
//
// The call is deliberately chatty-free: nothing is polled, so a lobby that
// loses the connection only has to open a new one.
service LobbyCoordination {
  rpc Coordinate(stream LobbyEvent) returns (stream HttpEvent);
}

// Everything a gameplay lobby reports to the coordinator.
message LobbyEvent {
  oneof event {
    LobbyRegistration registration = 1;
    PlayerPresenceChange player_presence = 2;
    FakeTeamListing fake_team_listing = 3;
  }
}

// First message of every stream. It names the lobby and carries the players
// that are connected at the moment the stream opens, so a coordinator that was
// restarted (or that never saw this lobby) starts from the truth instead of
// from the deltas it missed.
message LobbyRegistration {
  int32 lobby_identifier = 1;
  string lobby_name = 2;
  repeated ConnectedPlayer players = 3;
}

// One player of the lobby, as the lobby counts it.
message ConnectedPlayer {
  int32 character_identifier = 1;
}

// A player entered or left the lobby.
message PlayerPresenceChange {
  int32 lobby_identifier = 1;
  int32 character_identifier = 2;
  bool connected = 3;
}

// Everything the coordinator pushes to a gameplay lobby.
message HttpEvent {
  oneof event {
    FlashNewsBroadcast flash_news = 1;
    FakePlayerRequest fake_players = 2;
    FakeTeamRequest fake_team = 3;
    FakeTeamStateRequest fake_team_state = 4;
    FakeTeamQueryRequest fake_team_query = 5;
    FakeTeamMemberStateRequest fake_team_member_state = 7;
    FakeHostRoomRequest fake_host_room = 8;
  }
}

// A question the coordinator asks one lobby about the teams it holds, and the
// answer it sends back up the stream it arrived on.
//
// Every other arm of the two messages is a one-way push: the API hands a lobby
// something to do and the lobby logs what it did. Removing a team is the one
// request the API has to be told the answer to, because the team lives in the
// lobby that holds it and the caller is shown what it removed. The correlation
// is therefore carried on the wire, and the answer travels back on the
// direction the question did not: up the request stream.
message FakeTeamQueryRequest {
  // Correlation the answer carries back. The coordinator reads it off the
  // reply and hands the reply to the caller that is waiting for it.
  int64 request_identifier = 1;
  // Mode of the lobby being asked: 4 Survival, 3 Tournament or 10 Tournament
  // registration. A lobby asked for a mode it is not running refuses.
  int32 lobby_subtype = 2;
  // What to do with the teams the lobby holds.
  FakeTeamQueryAction action = 3;
  // Name of the team to remove, for the remove action.
  string team_name = 4;
}

// What the coordinator asked the lobby to do.
enum FakeTeamQueryAction {
  // No action was asked for; the lobby answers with an empty listing.
  FAKE_TEAM_QUERY_ACTION_UNSPECIFIED = 0;
  // Listing moved to the rows, which the API reads itself. The number is left
  // unused rather than reused so a lobby restarted mid-rollout never reads a
  // remove as a list.
  reserved 1;
  reserved "FAKE_TEAM_QUERY_ACTION_LIST";
  // Remove one team, named by the request.
  FAKE_TEAM_QUERY_ACTION_REMOVE = 2;
}

// The answer to one FakeTeamQueryRequest.
message FakeTeamListing {
  // Correlation of the request this answers.
  int64 request_identifier = 1;
  // A remove answers with the team that was removed, so a caller can see what
  // it removed; an empty list means there was no such team.
  repeated FakeTeamSummary teams = 2;
}

// One team as the lobby reports it.
message FakeTeamSummary {
  // Identifier the client caches, from the fake range.
  int32 team_identifier = 1;
  // Display name of the team.
  string team_name = 2;
  // Lifecycle state the client reads.
  int32 state = 3;
  // How many players the roster holds, leader included.
  int32 member_count = 4;
  // Event the team is filed under.
  int32 event_identifier = 5;
}

// A request to add test players to a team that already exists in a lobby. The
// team may be one a player formed or one a FakeTeamRequest created; the name is
// what identifies it, because the lobby resolves it against the teams it holds.
//
// The players are taken from the test-character pool, so they are real character
// rows under the server account rather than names the lobby invented.
//
// The lobby is named by its mode rather than by its identifier because the
// coordinator does not know the identifiers; the lobby that answers is the one
// whose mode matches.
message FakePlayerRequest {
  // Mode of the lobby the team is in: 4 Survival, 3 Tournament or
  // 10 Tournament registration.
  int32 lobby_subtype = 1;
  // How many players to add.
  int32 count = 2;
  // Name of the existing team the players join. It is required: a request that
  // names no team has nothing to fill.
  string team_name = 3;
  // Removed with the per-player naming: players now come from the pool and are
  // named there. The number is left unused so a lobby restarted mid-rollout
  // never reads it as something else.
  reserved 4;
  reserved "player_prefix";
}

// A request to create a testing team, for testing a team list or a roster. The
// team is an ordinary row whose players are taken from the test-character pool,
// the same characters a FakePlayerRequest fills a team with. Nothing here names
// an existing team; the team is the thing being created.
//
// The lobby is named by its mode rather than by its identifier because the
// coordinator does not know the identifiers; the lobby that answers is the one
// whose mode matches.
message FakeTeamRequest {
  // Mode of the lobby the team is created in: 4 Survival, 3 Tournament or
  // 10 Tournament registration.
  int32 lobby_subtype = 1;
  // How many players the team holds, leader included.
  int32 count = 2;
  // Display name the team is given, when one was asked for.
  string team_name = 3;
  // Removed with the per-player naming: players now come from the pool and are
  // named there. The number is left unused so a lobby restarted mid-rollout
  // never reads it as something else.
  reserved 4;
  reserved "player_prefix";
}

// A request to change the state of a team. The team is named rather than
// identified because the lobby resolves the name against the teams it holds
// itself.
//
// Changing the state is what lets a moderator see how a client renders a team at
// each phase of the entry pipeline, and changing the roster's member state is
// what exercises the per-member decision byte without a second player.
message FakeTeamStateRequest {
  // Mode of the lobby the team is in: 4 Survival, 3 Tournament or
  // 10 Tournament registration.
  int32 lobby_subtype = 1;
  // Name of the team whose state is changed. It is required.
  string team_name = 2;
  // The team state to store, as the client's own phase byte (1 open, 9 auto,
  // and so on).
  int32 state = 3;
  // The member state to force on the whole roster, or zero to let each member
  // follow the team state.
  int32 member_state = 4;
}

// A request to change the entry-decision byte on the fake players of a team
// that has a row — either one a player formed or one a pairing request wrote
// out.
//
// It exists because those players are undecidable by anyone else. They are
// added already in the state their team's own state implies, which for an open
// team is the byte the client paints "NG", and a fake player has no client with
// a button on it. A real player's own decision is never written by this: the
// fake range is what marks the members it moves, so a testing device cannot
// accept an entry on somebody's behalf.
//
// The team is named rather than identified because the coordinator knows the
// lobby's mode but not which row a team is, and the lobby resolves the name
// against its own lobby's teams.
message FakeTeamMemberStateRequest {
  // Mode of the lobby the team is in: 4 Survival, 3 Tournament or
  // 10 Tournament registration.
  int32 lobby_subtype = 1;
  // Name of the team whose fake members change. It is required.
  string team_name = 2;
  // The member state to store on each fake member: 1 pending, which the client
  // paints NG, or 2 ready, which it paints OK.
  int32 member_state = 3;
}

// A request to create a dedicated event host room in a lobby, so a pairing that
// has already been made can reach a host.
//
// A pairing is written when two teams are queued but is not announced until a
// room has been leased, and a room is only leased from one that is named for
// the role, says it is dedicated and is sitting idle with its host present.
// Those are all things a real host client does merely by existing, so without
// this request a pairing made from the testing tools waits forever for a room
// nobody has opened.
//
// The host character is named so a moderator can attribute the room, and zero
// lets the lobby pick one. It has to be a character that exists: the room's host
// column is a foreign key, and the eligibility rule requires the host to be
// present in the room's own roster.
message FakeHostRoomRequest {
  // Mode of the lobby the room belongs to: 4 Survival or 3 Tournament.
  int32 lobby_subtype = 1;
  // Character to host the room, or zero to let the lobby pick one.
  int32 host_character_identifier = 2;
}

// One ticker announcement the lobby has to write to its own clients. The fields
// are the ones the announcement is encoded with; the lobby builds the packet,
// because the payload is the client protocol and stays where the protocol is.
message FlashNewsBroadcast {
  string message = 1;
  uint32 unknown1 = 2;
  uint32 unknown2 = 3;
  uint32 subcommand = 4;
  uint32 unknown5 = 5;
  uint32 maintenance_time = 6;
}
