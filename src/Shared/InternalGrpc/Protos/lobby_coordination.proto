syntax = "proto3";

package mgo2.internal.v1;

option csharp_namespace = "Mgo2Server.Shared.InternalGrpc.Contracts";

// The channel between the HTTP API and every gameplay lobby. It is hosted by
// the HTTP API and opened by the lobby, which is the side that knows the
// server-to-server endpoint. One call carries both directions: the lobby sends
// its presence events down the request stream, the API sends the announcements
// it has to relay down the response stream.
//
// The call is deliberately chatty-free: nothing is polled, so a lobby that
// loses the connection only has to open a new one.
service LobbyCoordination {
  rpc Coordinate(stream LobbyEvent) returns (stream HttpEvent);
}

// Everything a gameplay lobby reports to the coordinator.
message LobbyEvent {
  oneof event {
    LobbyRegistration registration = 1;
    PlayerPresenceChange player_presence = 2;
  }
}

// First message of every stream. It names the lobby and carries the players
// that are connected at the moment the stream opens, so a coordinator that was
// restarted (or that never saw this lobby) starts from the truth instead of
// from the deltas it missed.
message LobbyRegistration {
  int32 lobby_identifier = 1;
  string lobby_name = 2;
  repeated ConnectedPlayer players = 3;
}

// One player of the lobby, as the lobby counts it.
message ConnectedPlayer {
  int32 character_identifier = 1;
}

// A player entered or left the lobby.
message PlayerPresenceChange {
  int32 lobby_identifier = 1;
  int32 character_identifier = 2;
  bool connected = 3;
}

// Everything the coordinator pushes to a gameplay lobby.
message HttpEvent {
  oneof event {
    FlashNewsBroadcast flash_news = 1;
    FakePlayerRequest fake_players = 2;
    FakeTeamRequest fake_team = 3;
    FakeTeamStateRequest fake_team_state = 4;
  }
}

// A request to add players who are not really there to a team that already
// exists in a lobby. The team may be a real row a player formed, or an
// in-memory team a FakeTeamRequest created; the name is what tells the two
// apart, because the lobby resolves it against its own teams first and then
// against the rows.
//
// The characters are named here and nowhere else: the lobby holds them in
// memory and never gives them a row in the accounts table, so they can play an
// event and leave no trace of having existed.
//
// The lobby is named by its mode rather than by its identifier because the
// coordinator does not know the identifiers; the lobby that answers is the one
// whose mode matches.
message FakePlayerRequest {
  // Mode of the lobby the team is in: 4 Survival, 3 Tournament or
  // 10 Tournament registration.
  int32 lobby_subtype = 1;
  // How many players to add.
  int32 count = 2;
  // Name of the existing team the players join. It is required: a request that
  // names no team has nothing to fill.
  string team_name = 3;
  // Name the players are shown with, when one was asked for. A blank one lets
  // the lobby compose a name per player.
  string player_prefix = 4;
}

// A request to create a team that exists only in the lobby's memory, for
// testing a team list or a roster without writing a row. Its players are fake
// in the same way as a FakePlayerRequest's: no account, no character, gone with
// the process. Unlike a FakePlayerRequest, nothing here names an existing team;
// the team is the thing being created.
//
// The lobby is named by its mode rather than by its identifier because the
// coordinator does not know the identifiers; the lobby that answers is the one
// whose mode matches.
message FakeTeamRequest {
  // Mode of the lobby the team is created in: 4 Survival, 3 Tournament or
  // 10 Tournament registration.
  int32 lobby_subtype = 1;
  // How many players the team holds, leader included.
  int32 count = 2;
  // Display name the team is given, when one was asked for.
  string team_name = 3;
  // Name the players are shown with, when one was asked for. A blank one lets
  // the lobby compose a name per player.
  string player_prefix = 4;
}

// A request to change the state of a team that exists only in a lobby's memory.
// The team is named rather than identified because, having no row, it has no
// identifier the coordinator could know; the lobby resolves the name against the
// teams it holds itself.
//
// Changing the state is what lets a moderator see how a client renders a team at
// each phase of the entry pipeline, and changing the roster's member state is
// what exercises the per-member decision byte without a second player.
message FakeTeamStateRequest {
  // Mode of the lobby the team is in: 4 Survival, 3 Tournament or
  // 10 Tournament registration.
  int32 lobby_subtype = 1;
  // Name of the in-memory team whose state is changed. It is required.
  string team_name = 2;
  // The team state to store, as the client's own phase byte (1 open, 9 auto,
  // and so on).
  int32 state = 3;
  // The member state to force on the whole roster, or zero to let each member
  // follow the team state.
  int32 member_state = 4;
}

// One ticker announcement the lobby has to write to its own clients. The fields
// are the ones the announcement is encoded with; the lobby builds the packet,
// because the payload is the client protocol and stays where the protocol is.
message FlashNewsBroadcast {
  string message = 1;
  uint32 unknown1 = 2;
  uint32 unknown2 = 3;
  uint32 subcommand = 4;
  uint32 unknown5 = 5;
  uint32 maintenance_time = 6;
}
