# Wave 2: a workload, and so only ever synced after the migration hook has
# succeeded.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mgo2-dns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/MiguelRipoll23/mgo2-server.git
    targetRevision: main
    path: deploy/dns
  destination:
    server: https://kubernetes.default.svc
    namespace: mgo2
  # Reloader rolls this workload when mgo2-appsettings changes; see deploy/README.md.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
