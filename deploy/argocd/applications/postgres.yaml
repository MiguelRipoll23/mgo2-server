# Wave 1: the database's name, which every wave-2 workload needs before it
# starts.
#
# The database itself is not a workload in this cluster. It runs as a Docker
# container on the node (deploy/postgres/compose.yaml), and this Application
# carries only the selector-less Service and the EndpointSlice that point at
# it. The container's entrypoint runs the migration bundle before it accepts a
# connection, so the schema is applied there rather than by this sync; Argo no
# longer has a readiness probe that could prove it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mgo2-postgres
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/MiguelRipoll23/mgo2-server.git
    targetRevision: main
    path: deploy/postgres
  destination:
    server: https://kubernetes.default.svc
    namespace: mgo2
  syncPolicy:
    automated:
      # prune is left on. What this folder declares is a Service and an
      # EndpointSlice; the StatefulSet was pruned when the database moved to the
      # node, and the PersistentVolumeClaim it created is not a tracked resource,
      # so a prune could not take the data with it either.
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
