# Wave 2: a workload, and so only ever synced after the migration hook has
# succeeded. The nine lobby deployments share one image and one tag, so they
# move together here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mgo2-game-lobby
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/MiguelRipoll23/mgo2-server.git
    targetRevision: main
    path: deploy/game-lobby
  destination:
    server: https://kubernetes.default.svc
    namespace: mgo2
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
