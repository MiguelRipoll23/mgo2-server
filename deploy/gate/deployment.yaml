apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    # Reloader rolls this pod when mgo2-appsettings changes; see deploy/README.md.
    configmap.reloader.stakater.com/reload: "mgo2-appsettings"
  labels:
    app: mgo2-gate
  name: mgo2-gate
  namespace: mgo2
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: mgo2-gate
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: mgo2-gate
    spec:
      containers:
      - env:
        - name: LOBBY_NAME
          value: GATE
        - name: LOBBY_PORT
          value: '5731'
        image: ghcr.io/miguelripoll23/mgo2-server/mgo2-gate-lobby-server:latest
        imagePullPolicy: Always
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - sleep 5
        name: gate
        ports:
        - containerPort: 5731
          protocol: TCP
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /app/appsettings.json
          name: appsettings
          readOnly: true
          subPath: appsettings.json
        envFrom:
        - secretRef:
            name: mgo2-secrets
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 21600
      volumes:
      - name: appsettings
        configMap:
          name: mgo2-appsettings
