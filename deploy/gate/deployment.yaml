apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    # Reloader rolls this pod when mgo2-appsettings changes; see deploy/README.md.
    configmap.reloader.stakater.com/reload: "mgo2-appsettings"
  labels:
    app: mgo2-gate
  name: mgo2-gate
  namespace: mgo2
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  # Two, not the default ten. Reloader writes an annotation onto the pod
  # template on every ConfigMap change, and each of those is a new ReplicaSet,
  # so a busy week accumulates a revision per reload. The history worth keeping
  # is in git; the cluster keeps only enough to roll back the last change.
  revisionHistoryLimit: 2
  # A pod is only counted available once it has been Ready this long, which is
  # what keeps a rollout from killing the old pod before the load balancer has
  # health-checked the new pod's node. See deploy/README.md,
  # "externalTrafficPolicy: Local".
  minReadySeconds: 10
  selector:
    matchLabels:
      app: mgo2-gate
  strategy:
    rollingUpdate:
      # Never below the current count. With Local, a node whose pods are all
      # gone drops its traffic rather than forwarding it elsewhere, so a rollout
      # that dips below the ready count dips below serving capacity.
      maxUnavailable: 0
      # Exactly one, not a percentage: 25% of a single replica rounds to zero, so
      # the surge that a Local rollout depends on would not happen at all.
      maxSurge: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: mgo2-gate
    spec:
      containers:
      - env:
        - name: LOBBY_NAME
          value: GATE
        - name: LOBBY_PORT
          value: '5731'
        image: ghcr.io/miguelripoll23/mgo2-server/mgo2-gate-lobby-server:latest
        imagePullPolicy: Always
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - sleep 5
        name: gate
        ports:
        - containerPort: 5731
          protocol: TCP
        # A startupProbe, not a readinessProbe, and the reason is the log rather
        # than the readiness. Both gate the same thing here, but a
        # readinessProbe is polled for the life of the pod: every poll is a
        # connect-then-drop, and TcpServerBase logs both halves, so each pod
        # wrote a connection and a disconnection every five seconds forever. A
        # startupProbe is polled only until it passes once and then stops, so
        # the steady state is silent. The bind is still verified, which is the
        # part externalTrafficPolicy: Local needs: until the probe passes the
        # pod is not Ready, so kube-proxy does not advertise a local endpoint
        # and the load balancer cannot send to a listener that has not bound.
        startupProbe:
          tcpSocket:
            port: 5731
          periodSeconds: 5
          # 5s x 120 is two minutes to bind before the container is restarted,
          # which is the whole startup budget this server needs.
          failureThreshold: 120
          timeoutSeconds: 3
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /app/appsettings.json
          name: appsettings
          readOnly: true
          subPath: appsettings.json
        envFrom:
        - secretRef:
            name: mgo2-secrets
      # Keep replicas on different nodes, and preferably off a node already
      # running one. Under Local, a node with no local endpoint drops the traffic
      # the load balancer sends it rather than forwarding it elsewhere, so
      # replicas sharing a node share that exposure. ScheduleAnyway rather than
      # DoNotSchedule: on a single-node cluster a hard requirement would leave
      # the pod Pending forever, and a pod that never starts serves nobody.
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: mgo2-gate
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 21600
      volumes:
      - name: appsettings
        configMap:
          name: mgo2-appsettings
