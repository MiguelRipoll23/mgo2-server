apiVersion: v1
kind: Service
metadata:
  name: mgo2-tournament-hosts
  namespace: mgo2
spec:
  # Local, so the pod sees the console's real address instead of the load
  # balancer's. See deploy/game-lobby/survival-service.yaml for why, which is the
  # same for all ten; deploy/README.md, "externalTrafficPolicy: Local".
  externalTrafficPolicy: Local
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  # 5744, not 5743: this Service is a LoadBalancer, so its external port is
  # bound on the node by a ServiceLB pod, and 5743 is already held there by
  # mgo2-http's internal gRPC endpoint. A second Service on the same port never
  # schedules, and a LoadBalancer with no address reads as Progressing in Argo
  # CD. See deploy/game-lobby/tournament-hosts-deployment.yaml.
  ports:
  - port: 5744
    protocol: TCP
    targetPort: 5744
  selector:
    app: mgo2-tournament-hosts
  sessionAffinity: None
  type: LoadBalancer
