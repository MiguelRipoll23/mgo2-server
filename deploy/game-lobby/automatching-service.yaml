apiVersion: v1
kind: Service
metadata:
  name: mgo2-automatching
  namespace: mgo2
spec:
  # Local, so the pod sees the console's real address instead of the load
  # balancer's. See deploy/game-lobby/survival-service.yaml for why, which is the
  # same for all nine; deploy/README.md, "externalTrafficPolicy: Local".
  externalTrafficPolicy: Local
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - port: 5740
    protocol: TCP
    targetPort: 5740
  selector:
    app: mgo2-automatching
  sessionAffinity: None
  type: LoadBalancer