apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    # Reloader rolls this pod when mgo2-appsettings changes; see deploy/README.md.
    configmap.reloader.stakater.com/reload: "mgo2-appsettings"
  name: mgo2-survival
  namespace: mgo2
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  # A pod is only counted available once it has been Ready this long, which is
  # what keeps a rollout from killing the old pod before the load balancer has
  # health-checked the new pod's node. See deploy/README.md,
  # "externalTrafficPolicy: Local".
  minReadySeconds: 10
  selector:
    matchLabels:
      app: mgo2-survival
  strategy:
    rollingUpdate:
      # Never below the current count. With Local, a node whose pods are all
      # gone drops its traffic rather than forwarding it elsewhere, so a rollout
      # that dips below the ready count dips below serving capacity.
      maxUnavailable: 0
      # Exactly one, not a percentage: 25% of a single replica rounds to zero, so
      # the surge that a Local rollout depends on would not happen at all.
      maxSurge: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: mgo2-survival
    spec:
      containers:
      - env:
        - name: LOBBY_NAME
          value: Survival
        - name: LOBBY_SUBTYPE
          value: SURVIVAL
        - name: LOBBY_PORT
          value: '5735'
        - name: LOBBY_BEGINNER_ONLY
          value: 'false'
        - name: LOBBY_EXPANSION_ONLY
          value: 'false'
        - name: LOBBY_NO_HEADSHOT
          value: 'false'
        - name: LOBBY_REPLAYS_ONLY
          value: 'false'
        image: ghcr.io/miguelripoll23/mgo2-server/mgo2-game-lobby-server:latest
        imagePullPolicy: Always
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - sleep 5
        name: lobby
        ports:
        - containerPort: 5735
          protocol: TCP
        # Not optional under externalTrafficPolicy: Local; see the note in
        # deploy/gate/deployment.yaml, which is the same case.
        readinessProbe:
          tcpSocket:
            port: 5735
          periodSeconds: 5
          failureThreshold: 3
          timeoutSeconds: 3
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /app/appsettings.json
          name: appsettings
          readOnly: true
          subPath: appsettings.json
        envFrom:
        - secretRef:
            name: mgo2-secrets
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: mgo2-survival
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 21600
      volumes:
      - name: appsettings
        configMap:
          name: mgo2-appsettings
