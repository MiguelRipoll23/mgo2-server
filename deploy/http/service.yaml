apiVersion: v1
kind: Service
metadata:
  name: mgo2-http
  namespace: mgo2
spec:
  # Local, so the pod sees the console's real address instead of the load
  # balancer's. TcpServerBase reads it off the accepted socket, so nothing
  # downstream has to change to use it.
  #
  # The cost is that a node forwards only to its own pods and DROPS traffic to a
  # node that has none, so the load balancer has to stop sending there before
  # the last pod goes. That is what healthCheckNodePort is for, and the paired
  # Deployment's rollout settings are built around it. See deploy/README.md,
  # "externalTrafficPolicy: Local".
  externalTrafficPolicy: Local
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 80
  # The pod terminates TLS itself, so 443 maps straight to the container rather
  # than to an ingress. A node's port belongs to one Service at a time — k3s's
  # ServiceLB binds the host port for whichever LoadBalancer claims it — so the
  # cluster's Traefik Service publishes no host port at all and this is the only
  # claimant of 443; see deploy/README.md, "HTTPS on 443".
  - name: https
    port: 443
    protocol: TCP
    targetPort: 443
  - name: grpc
    port: 5743
    protocol: TCP
    targetPort: 5743
  selector:
    app: mgo2-http
  sessionAffinity: None
  type: LoadBalancer