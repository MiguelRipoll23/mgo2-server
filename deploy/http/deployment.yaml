apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    # Reloader rolls this pod when mgo2-appsettings changes; see deploy/README.md.
    configmap.reloader.stakater.com/reload: "mgo2-appsettings"
  name: mgo2-http
  namespace: mgo2
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  # Two, not the default ten. Reloader writes an annotation onto the pod
  # template on every ConfigMap change, and each of those is a new ReplicaSet,
  # so a busy week accumulates a revision per reload. The history worth keeping
  # is in git; the cluster keeps only enough to roll back the last change.
  revisionHistoryLimit: 2
  # A pod is only counted available once it has been Ready this long, which is
  # what keeps a rollout from killing the old pod before the load balancer has
  # health-checked the new pod's node. See deploy/README.md,
  # "externalTrafficPolicy: Local".
  minReadySeconds: 10
  selector:
    matchLabels:
      app: mgo2-http
  strategy:
    rollingUpdate:
      # Never below the current count. With Local, a node whose pods are all
      # gone drops its traffic rather than forwarding it elsewhere, so a rollout
      # that dips below the ready count dips below serving capacity.
      maxUnavailable: 0
      # Exactly one, not a percentage: 25% of a single replica rounds to zero, so
      # the surge that a Local rollout depends on would not happen at all.
      maxSurge: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: mgo2-http
    spec:
      containers:
      - image: ghcr.io/miguelripoll23/mgo2-server/mgo2-http:latest
        imagePullPolicy: Always
        name: http
        ports:
        - containerPort: 80
          protocol: TCP
        - containerPort: 5743
          protocol: TCP
        # One probe, and a startupProbe rather than a readinessProbe. It asks
        # only "has it bound yet", which is what externalTrafficPolicy: Local
        # needs: until it passes the pod is not Ready, so kube-proxy does not
        # advertise a local endpoint and the load balancer cannot send to a
        # listener that has not bound. It is polled every five seconds until it
        # passes once and then stops, so the steady state costs nothing.
        #
        # There used to be a readinessProbe here, hourly, to notice a wedged
        # process. kubelet cannot be asked for that. Its probe worker begins
        # with a random sleep of up to the period before the first probe --
        # "let the worker wait for a random portion of tickerPeriod" in
        # `pkg/kubelet/prober/worker.go`, taken whenever the period is longer
        # than the kubelet's own uptime -- and the manual trigger
        # `UpdatePodStatus` sends is only read after that sleep. At 3600s the
        # pod sat NotReady for up to an hour after every node reboot, the
        # Service had no endpoints, and the Gateway had nothing to forward to;
        # this was the only deployment with a readinessProbe, so it was the only
        # one that stopped serving. A period short enough to be safe polls and
        # logs for the life of the pod, which is what the other fifteen
        # deployments reject, so a wedged HTTP process is not detected here. The
        # game servers are what carry the players.
        startupProbe:
          httpGet:
            path: /health
            port: 80
          periodSeconds: 5
          # 5s x 120 is two minutes to bind and serve before the container is
          # restarted.
          failureThreshold: 120
          timeoutSeconds: 3
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - NET_BIND_SERVICE
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /app/appsettings.json
          name: appsettings
          readOnly: true
          subPath: appsettings.json
        - mountPath: /root/.aspnet/DataProtection-Keys
          name: http-keys
        envFrom:
        - secretRef:
            name: mgo2-secrets
      # Keep replicas on different nodes, and preferably off a node already
      # running one. Under Local, a node with no local endpoint drops the traffic
      # the load balancer sends it rather than forwarding it elsewhere, so
      # replicas sharing a node share that exposure. ScheduleAnyway rather than
      # DoNotSchedule: on a single-node cluster a hard requirement would leave
      # the pod Pending forever, and a pod that never starts serves nobody.
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: mgo2-http
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: appsettings
        configMap:
          name: mgo2-appsettings
      - emptyDir: {}
        name: http-keys
