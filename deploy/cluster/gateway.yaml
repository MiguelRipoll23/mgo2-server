apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: mgo2-gateway
  namespace: mgo2
spec:
  gatewayClassName: traefik
  listeners:
  - name: http
    protocol: HTTP
    # Traefik matches a listener to one of its own entryPoints by that
    # entryPoint's port -- not by the listener's name, and not by the port a
    # client dials. Its `web` entryPoint listens on 8000 (`websecure` on 8443),
    # and Traefik's Service maps 80 -> 8000, so this is still port 80 to
    # anything outside the cluster. Declaring 80 here leaves the listener
    # unbindable: `PortUnavailable`, zero attached routes, and the HTTPRoute
    # attached to nothing.
    port: 8000
    allowedRoutes:
      namespaces:
        from: Same
