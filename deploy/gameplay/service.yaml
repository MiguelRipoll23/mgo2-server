apiVersion: v1
kind: Service
metadata:
  name: mgo2-gameplay-1
  namespace: mgo2
spec:
  # Headless. The pod is on the node's own network (hostNetwork, see
  # deployment.yaml), so it already answers on 192.168.1.15:5730 and the
  # console reaches it there directly.
  #
  # There is deliberately no load balancer in front of it. This host files its
  # session under the exact "address:port" a datagram arrived from -- the same
  # match the console makes on its side (MGO2.ELF, the receive loop) -- so it
  # has to see the wire as it really is. A LoadBalancer stands between the
  # console and the pod and rewrites the source address and port on the way in
  # and the reply on the way out, which is precisely the information this host
  # keys its session on. See deploy/README.md, "The gameplay reply path".
  clusterIP: None
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - port: 5730
    protocol: UDP
    targetPort: 5730
  selector:
    app: mgo2-gameplay-1
  sessionAffinity: None
  type: ClusterIP