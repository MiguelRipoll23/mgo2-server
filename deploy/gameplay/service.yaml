apiVersion: v1
kind: Service
metadata:
  name: mgo2-gameplay-1
  namespace: mgo2
spec:
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - port: 5730
    protocol: UDP
    targetPort: 5730
  selector:
    app: mgo2-gameplay-1
  sessionAffinity: None
  type: LoadBalancer