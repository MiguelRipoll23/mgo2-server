# Headless. The pod is on the node's own network (hostNetwork, see
# deployment.yaml), so it already answers on the node's 5731 and the console
# reaches it there directly, through the port forward on the public address.
#
# There is deliberately no load balancer in front of it, and this is not a
# close call. This host files its session under the exact "address:port" a
# datagram arrived from -- the same match the console makes on its side
# (MGO2.ELF, the receive loop at 0x262880) -- so it has to see the wire as it
# really is.
#
# externalTrafficPolicy: Local is not enough, and the reason matters on a
# cluster whose load balancer is k3s's own. Local controls kube-proxy's
# masquerading; it does not undo what a proxying hop already rewrote. The
# ServiceLB here is klipper-lb, a userspace proxy in a pod: the datagram
# reaches it carrying the console's address, and it forwards to the backend
# from a fresh socket, so the gameplay pod would see the *proxy's* address and
# an ephemeral port. The session would be filed under an endpoint no datagram
# ever arrives from, and every frame after the handshake would come back
# undecodable. This is the same reasoning that put the port check on the
# node's own network. See deploy/README.md, "The gameplay reply path".
#
# `clusterIP: None` is also why this Service cannot be changed in place.
# clusterIP is immutable, so moving between this and a LoadBalancer is a
# delete and a recreate and never a patch: ArgoCD fails the sync with "may
# not be set to 'None' for LoadBalancer services" and retries until the
# Service is deleted by hand.
apiVersion: v1
kind: Service
metadata:
  name: mgo2-gameplay-1
  namespace: mgo2
spec:
  clusterIP: None
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - port: 5731
    protocol: UDP
    targetPort: 5731
  selector:
    app: mgo2-gameplay-1
  sessionAffinity: None
  type: ClusterIP