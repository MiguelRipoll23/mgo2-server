apiVersion: v1
kind: Service
metadata:
  name: mgo2-gameplay-1
  namespace: mgo2
spec:
  # Local, so the pod sees the console's real endpoint instead of the load
  # balancer's. This host is the peer in the session it is hosting, and it
  # looks a session up by the exact "address:port" a datagram arrived from --
  # the same match the console makes on its side (MGO2.ELF, the receive loop at
  # 0x262880). Under Cluster the proxy rewrites the source, the session
  # provisioned from the handshake is filed under an address the next datagram
  # does not come from, and every frame after the handshake is undecodable.
  #
  # The cost is that a node forwards only to its own pods and DROPS traffic to a
  # node that has none, so the load balancer has to stop sending there before
  # the last pod goes. That is what healthCheckNodePort is for, and the paired
  # Deployment's rollout settings are built around it. See deploy/README.md,
  # "externalTrafficPolicy: Local".
  externalTrafficPolicy: Local
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - port: 5730
    protocol: UDP
    targetPort: 5730
  selector:
    app: mgo2-gameplay-1
  sessionAffinity: None
  type: LoadBalancer