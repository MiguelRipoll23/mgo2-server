apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    # Reloader rolls this pod when mgo2-appsettings changes; see deploy/README.md.
    configmap.reloader.stakater.com/reload: "mgo2-appsettings"
  name: mgo2-gameplay-1
  namespace: mgo2
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  # Two, not the default ten. Reloader writes an annotation onto the pod
  # template on every ConfigMap change, and each of those is a new ReplicaSet,
  # so a busy week accumulates a revision per reload. The history worth keeping
  # is in git; the cluster keeps only enough to roll back the last change.
  revisionHistoryLimit: 2
  # A pod is only counted available once it has been Ready this long, which is
  # what keeps a rollout from killing the old pod before the load balancer has
  # health-checked the new pod's node. See deploy/README.md,
  # "externalTrafficPolicy: Local".
  minReadySeconds: 10
  selector:
    matchLabels:
      app: mgo2-gameplay-1
  strategy:
    rollingUpdate:
      # Never below the current count. With Local, a node whose pods are all
      # gone drops its traffic rather than forwarding it elsewhere, so a rollout
      # that dips below the ready count dips below serving capacity.
      maxUnavailable: 0
      # Exactly one, not a percentage: 25% of a single replica rounds to zero, so
      # the surge that a Local rollout depends on would not happen at all.
      maxSurge: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: mgo2-gameplay-1
    spec:
      containers:
      - env:
        - name: GAMEPLAY_SERVER_PORT
          value: '5730'
        - name: GAMEPLAY_SERVER_LOBBY_NAME
          value: Free Battle
        # This host is the one endpoint a client dials with the socket MGO2 binds
        # to its own console address. That bind is the console's LAN address, and a
        # LAN-bound datagram cannot leave over the tailnet the ADVERTISED_ADDRESS
        # names, so this host alone announces the node's LAN address. It is what
        # P2P_HOST is for; leave it unset on a node that has one address.
        - name: P2P_HOST
          value: 192.168.1.15
        image: ghcr.io/miguelripoll23/mgo2-server/mgo2-gameplay-server:latest
        imagePullPolicy: Always
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - sleep 5
        name: gameplay
        ports:
        - containerPort: 5730
          protocol: UDP
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        readinessProbe:
          # Kubernetes has no UDP probe, so this asks /proc whether the socket is
          # bound. 5730 is 0x1662, and /proc/net/udp is per network namespace, so
          # the line only exists once the host's UdpClient is listening. A TCP
          # probe would pass against a port nothing ever accepts on.
          exec:
            command:
            - /bin/sh
            - -c
            - grep -qE ':1662[[:space:]]' /proc/net/udp
          periodSeconds: 5
          failureThreshold: 3
          timeoutSeconds: 3
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /app/appsettings.json
          name: appsettings
          readOnly: true
          subPath: appsettings.json
        envFrom:
        - secretRef:
            name: mgo2-secrets
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: mgo2-gameplay-1
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 21600
      volumes:
      - name: appsettings
        configMap:
          name: mgo2-appsettings
