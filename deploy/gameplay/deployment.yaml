apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    # Reloader rolls this pod when mgo2-appsettings changes; see deploy/README.md.
    configmap.reloader.stakater.com/reload: "mgo2-appsettings"
  name: mgo2-gameplay-1
  namespace: mgo2
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  # Two, not the default ten. Reloader writes an annotation onto the pod
  # template on every ConfigMap change, and each of those is a new ReplicaSet,
  # so a busy week accumulates a revision per reload. The history worth keeping
  # is in git; the cluster keeps only enough to roll back the last change.
  revisionHistoryLimit: 2
  # A pod is only counted available once it has been Ready this long, which is
  # what keeps a rollout from killing the old pod before the load balancer has
  # health-checked the new pod's node. See deploy/README.md,
  # "externalTrafficPolicy: Local".
  minReadySeconds: 10
  selector:
    matchLabels:
      app: mgo2-gameplay-1
  strategy:
    # Recreate, not RollingUpdate: the pod binds the node's own 5730, so a
    # surge would start the replacement while the old pod still holds the port
    # and the new one would never come up. Same reason the STUN responder is
    # Recreate, and it removes the need for the Local rollout settings below.
    type: Recreate
  template:
    metadata:
      labels:
        app: mgo2-gameplay-1
    spec:
      containers:
      - env:
        - name: GAMEPLAY_SERVER_PORT
          value: '5730'
        - name: GAMEPLAY_SERVER_LOBBY_NAME
          value: Free Battle
        # P2P_HOST is deliberately not set. It exists for a node whose clients bind
        # their socket to a LAN address, which cannot leave over the tailnet, so
        # that node has to announce its LAN address to be reachable at all. A client
        # bound to a tailnet address reaches this one at ADVERTISED_ADDRESS, which is
        # what it then advertises, and the two cannot drift apart. Set P2P_HOST only
        # for a LAN-bound client, and never alongside a tailnet-bound one.
        image: ghcr.io/miguelripoll23/mgo2-server/mgo2-gameplay-server:latest
        imagePullPolicy: Always
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - sleep 5
        name: gameplay
        ports:
        - containerPort: 5730
          protocol: UDP
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        readinessProbe:
          # Kubernetes has no UDP probe, so this asks /proc whether the socket is
          # bound. 5730 is 0x1662, and /proc/net/udp is per network namespace, so
          # the line only exists once the host's UdpClient is listening. A TCP
          # probe would pass against a port nothing ever accepts on.
          exec:
            command:
            - /bin/sh
            - -c
            - grep -qE ':1662[[:space:]]' /proc/net/udp
          periodSeconds: 5
          failureThreshold: 3
          timeoutSeconds: 3
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /app/appsettings.json
          name: appsettings
          readOnly: true
          subPath: appsettings.json
        envFrom:
        - secretRef:
            name: mgo2-secrets
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: mgo2-gameplay-1
      # On the node's own network, so a datagram arrives with the console's real
      # address and port and the reply leaves from the address the console
      # dialled. A Service LoadBalancer stands between the two and rewrites
      # both, and this host files its session under the exact "address:port" a
      # datagram arrived from, so it needs to see the wire as it really is.
      # This is the same shape the STUN responder uses, and for the same
      # reason: it identifies the peer by where the datagram came from. See
      # deploy/README.md, "The gameplay reply path".
      hostNetwork: true
      # Without WithHostNet the pod resolves cluster names against the
      # cluster's DNS from inside the host's namespace, where that address
      # means nothing, and the internal gRPC call to mgo2-http fails.
      dnsPolicy: ClusterFirstWithHostNet
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 21600
      volumes:
      - name: appsettings
        configMap:
          name: mgo2-appsettings
