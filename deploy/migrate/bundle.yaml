# The bundle digest the schema was applied with, as a tracked resource. The
# PreSync hook Job is not a managed resource, so a digest change on its own
# would never mark this Application OutOfSync and the migration would silently
# not run; this ConfigMap is the one thing Argo compares, and bumping it with a
# new bundle makes the Application sync and run the hook again. The postgres
# pipeline bumps it in the same commit that pins `newTag` — see the `gitops`
# step in .github/workflows/service.yml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mgo2-migrate-bundle
  namespace: mgo2
data:
  image: ghcr.io/miguelripoll23/mgo2-server/mgo2-postgres:74e91178d276f7db4854dfb7ac9ee9451eadd912