# The in-cluster database.
#
# The image carries the EF Core migration bundle and the pod applies it on
# startup, so this `newTag` is both the database's version and its schema's.
# The postgres pipeline rewrites it; see the `gitops` step in
# .github/workflows/service.yml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - service.yaml
  - statefulset.yaml

images:
  - name: ghcr.io/miguelripoll23/mgo2-server/mgo2-postgres
    newTag: 58bd8aa0c99d42156aeaf3dcf970664606ed4a5e
