# The database's cluster-side wiring.
#
# The database itself is not a workload in this cluster: it runs as a Docker
# container on the node. What remains here is the name the servers dial; the
# endpoint that points at the container follows once its data directory has
# been copied off the cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - service.yaml
