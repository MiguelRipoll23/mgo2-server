# The database's cluster-side wiring.
#
# The database itself is not a workload in this cluster. It runs as a Docker
# container on the node, defined by compose.yaml beside this file, so its data
# outlives the cluster's storage and it stays reachable while the cluster is
# down. What remains here is the name the servers dial and the endpoint that
# points at the container.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - endpoints.yaml
  - service.yaml
