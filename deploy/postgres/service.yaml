# How the servers reach the database. The name is the host in their
# DATABASE_CONNECTION_STRING (`Host=mgo2-postgres;Port=5432;...`), which lives
# in the mgo2-secrets Secret, so it has to stay.
#
# There is no selector: the backend is a container on the node, not a pod, and
# endpoints.yaml names it by hand. ClusterIP and nothing else, so the Service
# remains the only path from inside the cluster and the container's published
# port is not what a server dials.
apiVersion: v1
kind: Service
metadata:
  name: mgo2-postgres
  namespace: mgo2
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: postgres
    port: 5432
    protocol: TCP
    targetPort: 5432
  sessionAffinity: None
  type: ClusterIP
