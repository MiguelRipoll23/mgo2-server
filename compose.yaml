# Every role runs as its own container built from its own project, so a gate,
# an account server, a gameplay lobby, a gameplay server, the HTTP API, the name
# server or the port-check responder can be restarted, scaled or replaced
# independently.
#
# Every setting is a single upper-case environment variable. The images are the
# same ones the CI workflow publishes to ghcr.io, so a deployment may build them
# locally (as below) or pull them from the registry by setting MGO2_IMAGE_PREFIX
# and MGO2_IMAGE_TAG in .env; scripts/install-linux-macos.sh and
# scripts/install-windows.ps1 do exactly that pull-and-install sequence.
#
# There is one container per lobby listed below, which is the same set of
# servers the original deployment ran.
#
# Every lobby exists because its container was started: it publishes its own row
# from the environment below. A gameplay lobby heartbeats its row while it runs,
# and its row is cleaned up once it stops; the gate and the account server are
# permanent endpoints of the same kind and keep their row.
#
# Ports of the gameplay lobbies that reference the original server:
#   5733 Free Battle   5735 Survival           5740 Automatching
#   5734 Replays       5737 Basic Training     5741 Registration
#   5738 Combat Training  5739 Survival Hosts  5742 Tournament
#   5731 gate          5732 account            5730 Gameplay Host (UDP)
#     80 HTTP API        53 Name server (UDP)    3478 Port check, 3479 (UDP)

name: mgo2

x-database: &database
  env_file:
    - .env
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped
  # Lets a container reach the Grafana Alloy running on the host, which is where
  # the OpenTelemetry exporter sends the metrics (OTEL_HOST). Docker Desktop
  # resolves this name on its own; the mapping makes it resolve on Linux too.
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-gate-lobby-server: &gate-lobby-server
  <<: *database
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      PROJECT: src/GateLobbyServer/Mgo2Server.GateLobbyServer.csproj
      ASSEMBLY: Mgo2Server.GateLobbyServer
  image: ${MGO2_IMAGE_PREFIX:-}mgo2-gate-lobby-server:${MGO2_IMAGE_TAG:-latest}

x-account-lobby-server: &account-lobby-server
  <<: *database
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      PROJECT: src/AccountLobbyServer/Mgo2Server.AccountLobbyServer.csproj
      ASSEMBLY: Mgo2Server.AccountLobbyServer
  image: ${MGO2_IMAGE_PREFIX:-}mgo2-account-lobby-server:${MGO2_IMAGE_TAG:-latest}

x-game-lobby-server: &game-lobby-server
  <<: *database
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      PROJECT: src/GameLobbyServer/Mgo2Server.GameLobbyServer.csproj
      ASSEMBLY: Mgo2Server.GameLobbyServer
  image: ${MGO2_IMAGE_PREFIX:-}mgo2-game-lobby-server:${MGO2_IMAGE_TAG:-latest}

x-gameplay-server: &gameplay-server
  <<: *database
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      PROJECT: src/GameplayServer/Mgo2Server.GameplayServer.csproj
      ASSEMBLY: Mgo2Server.GameplayServer
  image: ${MGO2_IMAGE_PREFIX:-}mgo2-gameplay-server:${MGO2_IMAGE_TAG:-latest}

services:
  # The postgres container applies the schema migrations on startup, before it
  # accepts connections, so every database-backed server starts against a schema
  # that is already up to date. Its healthcheck fires only once PostgreSQL is
  # accepting connections, which is after the migration bundle has run.
  postgres:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: postgres
    image: ${MGO2_IMAGE_PREFIX:-}mgo2-postgres:${MGO2_IMAGE_TAG:-latest}
    container_name: mgo2-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: mgo2
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/healthcheck-postgres.sh"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # First connection point of the game: the lobby list and the news. It is a
  # permanent endpoint, so it needs no game type.
  mgo2-gate:
    <<: *gate-lobby-server
    container_name: mgo2-gate
    environment:
      LOBBY_NAME: GATE
      LOBBY_PORT: "5731"
    ports:
      - "5731:5731/tcp"

  # Character creation, selection and deletion. It is a permanent endpoint too.
  mgo2-account:
    <<: *account-lobby-server
    container_name: mgo2-account
    environment:
      LOBBY_NAME: ACCOUNT
      LOBBY_PORT: "5732"
    ports:
      - "5732:5732/tcp"

  # One container per gameplay lobby. The identity and the attributes of the
  # lobby come from the environment; LOBBY_SUBTYPE is the name of a game type
  # of the lobby_game_types table.
  mgo2-free-battle:
    <<: *game-lobby-server
    container_name: mgo2-free-battle
    environment:
      LOBBY_NAME: Free Battle
      LOBBY_SUBTYPE: FREE BATTLE
      LOBBY_PORT: "5733"
      LOBBY_BEGINNER_ONLY: "false"
      LOBBY_EXPANSION_ONLY: "false"
      LOBBY_NO_HEADSHOT: "false"
      LOBBY_REPLAYS_ONLY: "false"
    ports:
      - "5733:5733/tcp"

  mgo2-replays:
    <<: *game-lobby-server
    container_name: mgo2-replays
    environment:
      LOBBY_NAME: Replays
      LOBBY_SUBTYPE: BASIC TRAINING
      LOBBY_PORT: "5734"
      LOBBY_BEGINNER_ONLY: "false"
      LOBBY_EXPANSION_ONLY: "false"
      LOBBY_NO_HEADSHOT: "false"
      LOBBY_REPLAYS_ONLY: "false"
    ports:
      - "5734:5734/tcp"

  mgo2-survival:
    <<: *game-lobby-server
    container_name: mgo2-survival
    environment:
      LOBBY_NAME: Survival
      LOBBY_SUBTYPE: SURVIVAL
      LOBBY_PORT: "5735"
      LOBBY_BEGINNER_ONLY: "false"
      LOBBY_EXPANSION_ONLY: "false"
      LOBBY_NO_HEADSHOT: "false"
      LOBBY_REPLAYS_ONLY: "false"
    ports:
      - "5735:5735/tcp"

  mgo2-basic-training:
    <<: *game-lobby-server
    container_name: mgo2-basic-training
    environment:
      LOBBY_NAME: Basic Training
      LOBBY_SUBTYPE: BASIC TRAINING
      LOBBY_PORT: "5737"
      LOBBY_BEGINNER_ONLY: "false"
      LOBBY_EXPANSION_ONLY: "false"
      LOBBY_NO_HEADSHOT: "false"
      LOBBY_REPLAYS_ONLY: "false"
    ports:
      - "5737:5737/tcp"

  mgo2-combat-training:
    <<: *game-lobby-server
    container_name: mgo2-combat-training
    environment:
      LOBBY_NAME: Combat Training
      LOBBY_SUBTYPE: COMBAT TRAINING
      LOBBY_PORT: "5738"
      LOBBY_BEGINNER_ONLY: "false"
      LOBBY_EXPANSION_ONLY: "false"
      LOBBY_NO_HEADSHOT: "false"
      LOBBY_REPLAYS_ONLY: "false"
    ports:
      - "5738:5738/tcp"

  mgo2-survival-hosts:
    <<: *game-lobby-server
    container_name: mgo2-survival-hosts
    environment:
      LOBBY_NAME: Survival Hosts
      LOBBY_SUBTYPE: UNKNOWN
      LOBBY_PORT: "5739"
      LOBBY_BEGINNER_ONLY: "false"
      LOBBY_EXPANSION_ONLY: "false"
      LOBBY_NO_HEADSHOT: "false"
      LOBBY_REPLAYS_ONLY: "false"
    ports:
      - "5739:5739/tcp"

  mgo2-automatching:
    <<: *game-lobby-server
    container_name: mgo2-automatching
    environment:
      LOBBY_NAME: Automatching
      LOBBY_SUBTYPE: AUTOMATCHING
      LOBBY_PORT: "5740"
      LOBBY_BEGINNER_ONLY: "false"
      LOBBY_EXPANSION_ONLY: "false"
      LOBBY_NO_HEADSHOT: "false"
      LOBBY_REPLAYS_ONLY: "false"
    ports:
      - "5740:5740/tcp"

  mgo2-registration:
    <<: *game-lobby-server
    container_name: mgo2-registration
    environment:
      LOBBY_NAME: Registration
      LOBBY_SUBTYPE: TOURNAMENT REGISTRATION
      LOBBY_PORT: "5741"
      LOBBY_BEGINNER_ONLY: "false"
      LOBBY_EXPANSION_ONLY: "false"
      LOBBY_NO_HEADSHOT: "false"
      LOBBY_REPLAYS_ONLY: "false"
    ports:
      - "5741:5741/tcp"

  mgo2-tournament:
    <<: *game-lobby-server
    container_name: mgo2-tournament
    environment:
      LOBBY_NAME: Tournament
      LOBBY_SUBTYPE: TOURNAMENT
      LOBBY_PORT: "5742"
      LOBBY_BEGINNER_ONLY: "false"
      LOBBY_EXPANSION_ONLY: "false"
      LOBBY_NO_HEADSHOT: "false"
      LOBBY_REPLAYS_ONLY: "false"
    ports:
      - "5742:5742/tcp"

  # Gameplay hosts. Add one block per host, each with its own UDP
  # port and the lobby it publishes its match in. The host waits for that lobby
  # to be registered by its game lobby server.
  mgo2-gameplay-1:
    <<: *gameplay-server
    container_name: mgo2-gameplay-1
    environment:
      GAMEPLAY_SERVER_PORT: "5730"
      GAMEPLAY_SERVER_LOBBY_NAME: Free Battle
      P2P_HOST: ${ADVERTISED_ADDRESS:-127.0.0.1}
    ports:
      - "5730:5730/udp"

  # Public HTTP API and its Scalar reference UI.
  mgo2-http:
    <<: *database
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PROJECT: src/Http/Mgo2Server.Http.csproj
        ASSEMBLY: Mgo2Server.Http
    image: ${MGO2_IMAGE_PREFIX:-}mgo2-http:${MGO2_IMAGE_TAG:-latest}
    container_name: mgo2-http
    environment:
      HTTP_PORT: "80"
      LAUNCHER_SERVER: http://mgo2pc.com
    # A mounted volume at the Data Protection key ring silences the framework's
    # "keys may not be persisted" warning and keeps protected payloads valid
    # across restarts.
    volumes:
      - http-keys:/root/.aspnet/DataProtection-Keys
    ports:
      - "80:80/tcp"

  # Name server. It owns the well-known port 53.
  mgo2-dns:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PROJECT: src/Dns/Mgo2Server.Dns.csproj
        ASSEMBLY: Mgo2Server.Dns
    image: ${MGO2_IMAGE_PREFIX:-}mgo2-dns:${MGO2_IMAGE_TAG:-latest}
    container_name: mgo2-dns
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "53:53/udp"

  # Port-check responder. It answers the NAT discovery the console runs before it
  # will let a player into a lobby, on the port the console dials and the one after
  # it, which is where an answer to a request to change the port is sent from. It
  # needs no database, binds every interface and names ADVERTISED_ADDRESS in its
  # answers the way the name server does, so it does not have to own that address.
  mgo2-stun:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PROJECT: src/Stun/Mgo2Server.Stun.csproj
        ASSEMBLY: Mgo2Server.Stun
    image: ${MGO2_IMAGE_PREFIX:-}mgo2-stun:${MGO2_IMAGE_TAG:-latest}
    container_name: mgo2-stun
    env_file:
      - .env
    restart: unless-stopped
    # Both ports are published: the console dials 3478, and it is told to reach
    # 3479 for the test that detects a symmetric NAT, so that one has to arrive
    # too. On Linux the container sees the source address and port of the console
    # unchanged through the port mapping, which is the address the console is told
    # it appears as. Docker Desktop forwards published ports through its own proxy
    # and the request then arrives from the proxy instead, so there the mapped
    # address is wrong: enable Docker Desktop's host-networking setting for this
    # container, or run this one role from scripts/run-linux-macos.sh or
    # run-windows.ps1 outside Docker.
    ports:
      - "3478:3478/udp"
      - "3479:3479/udp"
    environment:
      STUN_PORT: "3478"
      # A bridge container owns one address, so the responder can move the port
      # but not the address, and a restricted-cone NAT is then read as a full-cone
      # one. Serving a second address means owning both, which only works where
      # the responder has host addresses of its own: set network_mode: host on
      # this service and drop this line, or run it outside Docker. Clearing it
      # here keeps a value in .env from failing the bind.
      STUN_SECONDARY_ADDRESS: ""

volumes:
  http-keys:
  postgres-data:
