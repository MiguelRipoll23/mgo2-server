apiVersion: v1
kind: Service
metadata:
  name: mgo2-replays
  namespace: mgo2
spec:
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - port: 5734
    protocol: TCP
    targetPort: 5734
  selector:
    app: mgo2-replays
  sessionAffinity: None
  type: LoadBalancer