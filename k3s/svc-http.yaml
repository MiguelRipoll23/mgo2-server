apiVersion: v1
kind: Service
metadata:
  name: mgo2-http
  namespace: mgo2
spec:
  clusterIP: 10.43.18.14
  clusterIPs:
  - 10.43.18.14
  externalIPs:
  - 192.168.1.15
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 80
  - name: grpc
    port: 5743
    protocol: TCP
    targetPort: 5743
  selector:
    app: mgo2-http
  sessionAffinity: None
  type: ClusterIP
