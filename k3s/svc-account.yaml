apiVersion: v1
kind: Service
metadata:
  name: mgo2-account
  namespace: mgo2
spec:
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - port: 5732
    protocol: TCP
    targetPort: 5732
  selector:
    app: mgo2-account
  sessionAffinity: None
  type: LoadBalancer