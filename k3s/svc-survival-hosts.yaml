apiVersion: v1
kind: Service
metadata:
  name: mgo2-survival-hosts
  namespace: mgo2
spec:
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - port: 5739
    protocol: TCP
    targetPort: 5739
  selector:
    app: mgo2-survival-hosts
  sessionAffinity: None
  type: LoadBalancer