apiVersion: v1
kind: Service
metadata:
  name: mgo2-basic-training
  namespace: mgo2
spec:
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - port: 5737
    protocol: TCP
    targetPort: 5737
  selector:
    app: mgo2-basic-training
  sessionAffinity: None
  type: LoadBalancer