# Builds and publishes one container image per standalone server project, then
# deploys the images this run rebuilt to the self-hosted runner. Every role is
# its own executable, so every role gets its own image and its own container;
# there is no combined image. The mgo2-postgres image is the custom PostgreSQL
# image that also carries the migration bundle; it is managed separately from
# the servers and is never deployed by this workflow.
#
# The build runs on a GitHub-hosted runner and only builds the projects whose
# files changed, exactly as before; a version tag builds and deploys every
# image. A manual run from the Actions tab skips the build and deploys the whole
# stack from the published images. A push that matches no project skips the
# build and the deployment without failing the run. The deploy job runs on the
# self-hosted runner: it applies the pending schema migrations with the bundle
# against the connection string in /opt/mgo2-server/appsettings.json, and only then
# recreates the containers whose image changed. A failed migration stops the
# job, so no container is ever recreated against a schema the migration has not
# applied, and a missing appsettings.json is created from the example and skips
# the deployment without failing the run.
name: "Build & Deploy"

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Cancel in-progress runs for the same workflow, branch, and event.
# Only the most recent commit's run continues.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # The deployment directory the install scripts create on the host: compose.yaml
  # and appsettings.json live there together and compose resolves the mounts
  # against it.
  DEPLOYMENT_DIRECTORY: /opt/mgo2-server

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    # A manual run deploys the published images and never builds.
    if: github.event_name != 'workflow_dispatch'
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Mgo2Server.slnx

      - name: Build
        run: dotnet build Mgo2Server.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Mgo2Server.slnx --configuration Release --no-build


  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      # The images to build and deploy. A version tag and a manual dispatch
      # select every image, so a manual run deploys the whole stack; every other
      # push builds only the projects whose files changed. An empty result
      # becomes the placeholder 'none' so the matrix of the images job is never
      # empty, which GitHub rejects, and has_images is what skips that job, and
      # every job that needs it, when nothing changed.
      images: ${{ (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && '["mgo2-gate-lobby-server","mgo2-account-lobby-server","mgo2-game-lobby-server","mgo2-gameplay-server","mgo2-http","mgo2-dns","mgo2-stun","mgo2-postgres"]' || ((steps.filter.outputs.changes == '[]' || steps.filter.outputs.changes == '') && '["none"]' || steps.filter.outputs.changes) }}
      has_images: ${{ (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || (steps.filter.outputs.changes != '[]' && steps.filter.outputs.changes != '')) && 'true' || 'false' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Detect changed projects
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            mgo2-gate-lobby-server:
              - 'src/GateLobbyServer/**'
              - 'src/Shared/**'
              - 'Directory.Build.props'
              - 'Mgo2Server.slnx'
              - 'appsettings.example.json'
              - 'docker/Dockerfile'
            mgo2-account-lobby-server:
              - 'src/AccountLobbyServer/**'
              - 'src/Shared/**'
              - 'Directory.Build.props'
              - 'Mgo2Server.slnx'
              - 'appsettings.example.json'
              - 'docker/Dockerfile'
            mgo2-game-lobby-server:
              - 'src/GameLobbyServer/**'
              - 'src/Shared/**'
              - 'Directory.Build.props'
              - 'Mgo2Server.slnx'
              - 'appsettings.example.json'
              - 'docker/Dockerfile'
            mgo2-gameplay-server:
              - 'src/GameplayServer/**'
              - 'src/Shared/**'
              - 'Directory.Build.props'
              - 'Mgo2Server.slnx'
              - 'appsettings.example.json'
              - 'docker/Dockerfile'
            mgo2-http:
              - 'src/Http/**'
              - 'src/Shared/**'
              - 'Directory.Build.props'
              - 'Mgo2Server.slnx'
              - 'appsettings.example.json'
              - 'docker/Dockerfile'
            mgo2-dns:
              - 'src/Dns/**'
              - 'src/Shared/**'
              - 'Directory.Build.props'
              - 'Mgo2Server.slnx'
              - 'appsettings.example.json'
              - 'docker/Dockerfile'
            mgo2-stun:
              - 'src/Stun/**'
              - 'src/Shared/**'
              - 'Directory.Build.props'
              - 'Mgo2Server.slnx'
              - 'appsettings.example.json'
              - 'docker/Dockerfile'
            mgo2-postgres:
              - 'src/Shared/**'
              - 'Directory.Build.props'
              - 'Mgo2Server.slnx'
              - '.config/**'
              - 'docker/Dockerfile'
              - 'docker/entrypoint-postgres.sh'
              - 'docker/healthcheck-postgres.sh'

  images:
    # The matrix is not expanded for a skipped job, so a name built from it would
    # show the literal ${{ matrix.image }} there instead of an image name.
    name: Publish images
    runs-on: ubuntu-latest
    needs:
      - test
      - changes
    # Nothing to build is a skip, not an error: the empty matrix would otherwise
    # fail the run when no project changed, and a manual run needs no build at
    # all. The deploy job still needs this one, so it checks for that.
    if: github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch' && needs.changes.outputs.has_images == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - name: Resolve image configuration
        id: config
        shell: bash
        run: |
          case "${{ matrix.image }}" in
            mgo2-gate-lobby-server)
              echo "project=src/GateLobbyServer/Mgo2Server.GateLobbyServer.csproj" >> "$GITHUB_OUTPUT"
              echo "assembly=Mgo2Server.GateLobbyServer" >> "$GITHUB_OUTPUT"
              echo "target=runtime" >> "$GITHUB_OUTPUT"
              ;;
            mgo2-account-lobby-server)
              echo "project=src/AccountLobbyServer/Mgo2Server.AccountLobbyServer.csproj" >> "$GITHUB_OUTPUT"
              echo "assembly=Mgo2Server.AccountLobbyServer" >> "$GITHUB_OUTPUT"
              echo "target=runtime" >> "$GITHUB_OUTPUT"
              ;;
            mgo2-game-lobby-server)
              echo "project=src/GameLobbyServer/Mgo2Server.GameLobbyServer.csproj" >> "$GITHUB_OUTPUT"
              echo "assembly=Mgo2Server.GameLobbyServer" >> "$GITHUB_OUTPUT"
              echo "target=runtime" >> "$GITHUB_OUTPUT"
              ;;
            mgo2-gameplay-server)
              echo "project=src/GameplayServer/Mgo2Server.GameplayServer.csproj" >> "$GITHUB_OUTPUT"
              echo "assembly=Mgo2Server.GameplayServer" >> "$GITHUB_OUTPUT"
              echo "target=runtime" >> "$GITHUB_OUTPUT"
              ;;
            mgo2-http)
              echo "project=src/Http/Mgo2Server.Http.csproj" >> "$GITHUB_OUTPUT"
              echo "assembly=Mgo2Server.Http" >> "$GITHUB_OUTPUT"
              echo "target=runtime" >> "$GITHUB_OUTPUT"
              ;;
            mgo2-dns)
              echo "project=src/Dns/Mgo2Server.Dns.csproj" >> "$GITHUB_OUTPUT"
              echo "assembly=Mgo2Server.Dns" >> "$GITHUB_OUTPUT"
              echo "target=runtime" >> "$GITHUB_OUTPUT"
              ;;
            mgo2-stun)
              echo "project=src/Stun/Mgo2Server.Stun.csproj" >> "$GITHUB_OUTPUT"
              echo "assembly=Mgo2Server.Stun" >> "$GITHUB_OUTPUT"
              echo "target=runtime" >> "$GITHUB_OUTPUT"
              ;;
            mgo2-postgres)
              echo "target=postgres" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Check out the repository
        uses: actions/checkout@v7

      # The registry requires a lower-case path, and an owner may not be.
      - name: Resolve the image name
        id: image
        run: echo "value=${REGISTRY}/${GITHUB_REPOSITORY,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive the tags and labels
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.value }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ steps.config.outputs.target }}
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            PROJECT=${{ steps.config.outputs.project }}
            ASSEMBLY=${{ steps.config.outputs.assembly }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Deployment runs on the machine that hosts the stack. A manual run comes
  # straight here and deploys every image without building; every other run
  # waits for the images job and deploys only what it published. Nothing to
  # build is not a deployment, so a run with no changed project, a failed build
  # and a failed detection all leave this job skipped. The migration step runs
  # first, and a failure there fails the job before the deploy step runs; a
  # missing appsettings.json skips the deployment without failing the run.
  deploy:
    name: Deploy
    runs-on: [self-hosted, Linux, ARM64]
    needs:
      - changes
      - images
    # always() keeps a skipped images job from skipping this one, and
    # !cancelled() keeps a cancelled run from deploying. The checks after them
    # decide whether this run may deploy at all.
    if: always() && !cancelled() && needs.changes.result == 'success' && github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || needs.images.result == 'success')
    permissions:
      contents: read
      packages: read
    steps:
      # The deployment pulls the tag of the ref it was built from: latest for a
      # branch, and the version of a v tag, which is the tag docker/metadata-action
      # derives from the same ref after dropping the leading v.
      - name: Resolve the deployment tag
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = 'tag' ]; then
            echo "MGO2_IMAGE_TAG=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "MGO2_IMAGE_TAG=latest" >> "$GITHUB_ENV"
          fi

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply the pending database migrations
        id: migrations
        shell: bash
        run: |
          set -euo pipefail

          # Turns %XX escapes and '+' back into the bytes they stand for.
          url_decode() {
            local value="${1//+/ }"
            printf '%b' "${value//%/\\x}"
          }

          # Rewrites a postgresql:// URL as the keyword=value string Npgsql
          # reads, the way scripts/run-linux-macos.sh does. Npgsql reads the
          # keyword form only, and the Neon console hands out a URL, so the
          # operator can paste either. A string that is already keyword=value
          # is returned untouched.
          convert_to_npgsql_connection_string() {
            local connection_string="$1"
            if [[ ! "$connection_string" =~ ^[[:space:]]*postgres(ql)?:// ]]; then
              printf '%s' "$connection_string"
              return 0
            fi

            local remainder="${connection_string#*://}"

            local query=""
            if [[ "$remainder" == *"?"* ]]; then
              query="${remainder#*\?}"
              remainder="${remainder%%\?*}"
            fi

            local path=""
            if [[ "$remainder" == *"/"* ]]; then
              path="${remainder#*/}"
              remainder="${remainder%%/*}"
            fi

            local userinfo="" hostport="$remainder"
            if [[ "$remainder" == *"@"* ]]; then
              userinfo="${remainder%@*}"
              hostport="${remainder##*@}"
            fi

            local host="${hostport%%:*}" port=""
            if [[ "$hostport" == *":"* ]]; then
              port="${hostport##*:}"
            fi

            local settings=("Host=$host")
            [ -n "$port" ] && settings+=("Port=$port")
            [ -n "$path" ] && settings+=("Database=$(url_decode "$path")")

            if [ -n "$userinfo" ]; then
              settings+=("Username=$(url_decode "${userinfo%%:*}")")
              if [[ "$userinfo" == *":"* ]]; then
                settings+=("Password=$(url_decode "${userinfo#*:}")")
              fi
            fi

            local parameter name value
            if [ -n "$query" ]; then
              local IFS='&'
              for parameter in $query; do
                [ -n "$parameter" ] || continue

                name="${parameter%%=*}"
                value=""
                if [[ "$parameter" == *"="* ]]; then
                  value="${parameter#*=}"
                fi

                case "${name,,}" in
                  sslmode) settings+=("SSL Mode=$(url_decode "$value")") ;;
                  channel_binding) settings+=("Channel Binding=$(url_decode "$value")") ;;
                  application_name) settings+=("Application Name=$(url_decode "$value")") ;;
                  connect_timeout) settings+=("Timeout=$(url_decode "$value")") ;;
                  *) echo "warning: '${name,,}' of the connection string has no Npgsql equivalent and is ignored" >&2 ;;
                esac
              done
            fi

            local result="" item
            for item in "${settings[@]}"; do
              if [ -z "$result" ]; then
                result="$item"
              else
                result="$result;$item"
              fi
            done
            printf '%s' "$result"
          }

          settings_file="${DEPLOYMENT_DIRECTORY}/appsettings.json"

          if [ ! -f "$settings_file" ]; then
            echo "error: ${settings_file} was not found" >&2
            exit 1
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

          # The servers read this key from the same file, so the migration is
          # applied with the connection string the deployment runs with. A Neon
          # URL works as it comes from the console: the direct (non-pooled) host
          # is the one Neon recommends for migrations, and the URL is rewritten
          # to the keyword form below. Npgsql negotiates TLS and validates Neon's
          # certificate against the system trust store, so no client certificate
          # or root certificate is needed.
          if command -v jq >/dev/null 2>&1; then
            connection_string="$(jq --raw-output '.DATABASE_CONNECTION_STRING // empty' "$settings_file")"
          else
            connection_string="$(sed -n 's/.*"DATABASE_CONNECTION_STRING"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$settings_file" | head -n 1)"
          fi

          if [ -z "$connection_string" ]; then
            echo "error: DATABASE_CONNECTION_STRING is missing from ${settings_file}" >&2
            exit 1
          fi

          # Npgsql reads the keyword form only, so a Neon URL is rewritten here
          # before the bundle sees it.
          connection_string="$(convert_to_npgsql_connection_string "$connection_string")"

          # The migration bundle is carried by the postgres image, so the schema
          # is applied by the same artifact the deployment was built from and no
          # runner needs the SDK or the source tree. Overriding the entrypoint
          # runs the bundle once and exits instead of starting PostgreSQL.
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}/mgo2-postgres:${MGO2_IMAGE_TAG}"
          echo "Applying the pending migrations from ${image}"

          docker pull "$image"
          docker run --rm --entrypoint /bundle/efbundle "$image" --connection "$connection_string"

      # Only the containers whose image this run rebuilt are recreated. Every
      # image maps to the compose services that run it; the gameplay lobby image
      # backs one container per lobby, so a change to it recreates all of them.
      # mgo2-postgres is absent on purpose: it is managed separately and is never
      # pulled, recreated or stopped here.
      - name: Deploy the changed containers
        # success() is written out because an if drops the implicit check, and a
        # failed migration must never be followed by a deployment.
        if: success() && steps.migrations.outputs.ready == 'true'
        shell: bash
        env:
          CHANGED_IMAGES: ${{ needs.changes.outputs.images }}
        run: |
          set -euo pipefail

          if [ ! -f "${DEPLOYMENT_DIRECTORY}/compose.yaml" ]; then
            echo "warning: ${DEPLOYMENT_DIRECTORY}/compose.yaml missing; fetching from repo"
            curl --fail --silent --show-error --location \
                 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/compose.yaml" \
                 --output "${DEPLOYMENT_DIRECTORY}/compose.yaml" || true
          fi

          if [ ! -f "${DEPLOYMENT_DIRECTORY}/compose.yaml" ]; then
            echo "error: ${DEPLOYMENT_DIRECTORY}/compose.yaml was not found" >&2
            exit 1
          fi

          services=''
          for image in $(printf '%s' "$CHANGED_IMAGES" | tr -d '[]"' | tr ',' ' '); do
            case "$image" in
              mgo2-gate-lobby-server)
                services="$services mgo2-gate"
                ;;
              mgo2-account-lobby-server)
                services="$services mgo2-account"
                ;;
              mgo2-game-lobby-server)
                services="$services mgo2-free-battle mgo2-replays mgo2-survival mgo2-basic-training mgo2-combat-training mgo2-survival-hosts mgo2-automatching mgo2-registration mgo2-tournament"
                ;;
              mgo2-gameplay-server)
                services="$services mgo2-gameplay-1"
                ;;
              mgo2-http)
                services="$services mgo2-http"
                ;;
              mgo2-dns)
                services="$services mgo2-dns"
                ;;
              mgo2-stun)
                services="$services mgo2-stun"
                ;;
            esac
          done
          services="$(printf '%s' "$services" | xargs)"

          if [ -z "$services" ]; then
            echo "No deployable container changed; nothing to deploy."
            exit 0
          fi

          for svc in $services; do
            case "$svc" in
              mgo2-gate) img="mgo2-gate-lobby-server";;
              mgo2-account) img="mgo2-account-lobby-server";;
              mgo2-free-battle|mgo2-replays|mgo2-survival|mgo2-basic-training|mgo2-combat-training|mgo2-survival-hosts|mgo2-automatching|mgo2-registration|mgo2-tournament) img="mgo2-game-lobby-server";;
              mgo2-gameplay-1) img="mgo2-gameplay-server";;
              mgo2-http) img="mgo2-http";;
              mgo2-dns) img="mgo2-dns";;
              mgo2-stun) img="mgo2-stun";;
              *) img="$svc";;
            esac
            for d in $svc; do
              kubectl set image deployment/$d $d=${REGISTRY}/${GITHUB_REPOSITORY,,}/${img}:${MGO2_IMAGE_TAG} -n default
              kubectl rollout restart deployment/$d -n default
              kubectl rollout status deployment/$d -n default --timeout=180s
            done
          done
          kubectl get pods -n default -o wide || true
