# The database image's pipeline. mgo2-postgres carries the EF Core bundle, and
# it reaches the cluster two ways: it is the database workload itself
# (deploy/postgres, whose entrypoint migrates before it accepts connections),
# and it is the bundle deploy/migrate/ runs as a PreSync hook. This pipeline
# publishes the image and pins both folders in one commit, so the database a
# release runs and the schema that release applies are always the same bundle.
#
# `dotnet-ef` is what builds the bundle, so a change to the tool manifest has to
# wake this pipeline; the bundle stage is the only consumer of it.
name: Migration bundle

on:
  push:
    branches:
      - main
    paths:
      - "src/Shared/**"
      - "Directory.Build.props"
      - "Mgo2Server.slnx"
      - "docker/Dockerfile"
      - "docker/entrypoint-postgres.sh"
      - "docker/healthcheck-postgres.sh"
      - ".config/**"
      - ".github/workflows/service.yml"
      - ".github/workflows/postgres.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/Shared/**"
      - "Directory.Build.props"
      - "Mgo2Server.slnx"
      - "docker/Dockerfile"
      - "docker/entrypoint-postgres.sh"
      - "docker/healthcheck-postgres.sh"
      - ".config/**"
      - ".github/workflows/service.yml"
      - ".github/workflows/postgres.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Migration bundle
    uses: ./.github/workflows/service.yml
    with:
      service: postgres
      image: mgo2-postgres
      # The bundle is built from the model in Shared, so that is the project
      # whose changes decide whether there is a new bundle to publish.
      context: src/Shared/Mgo2Server.Shared.csproj
      # Both folders that pin mgo2-postgres, so neither can lag the other.
      manifests: postgres migrate
      target: postgres
      # No PROJECT or ASSEMBLY: the postgres stage is built from the bundle
      # stage alone.
      test_filter: "(Category=Shared)"
