# Builds and publishes one container image per standalone server project. Every
# role is its own executable, so every role gets its own image and its own
# container; there is no combined image.
name: Docker images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Mgo2Server.slnx

      - name: Build
        run: dotnet build Mgo2Server.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Mgo2Server.slnx --configuration Release --no-build

  images:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: test
    # Pull requests only run the tests; an image is published from main and from
    # version tags.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mgo2-gate-lobby-server
            project: src/GateLobbyServer/Mgo2Server.GateLobbyServer.csproj
            assembly: Mgo2Server.GateLobbyServer
          - image: mgo2-account-lobby-server
            project: src/AccountLobbyServer/Mgo2Server.AccountLobbyServer.csproj
            assembly: Mgo2Server.AccountLobbyServer
          - image: mgo2-game-lobby-server
            project: src/GameLobbyServer/Mgo2Server.GameLobbyServer.csproj
            assembly: Mgo2Server.GameLobbyServer
          - image: mgo2-gameplay-server
            project: src/GameplayServer/Mgo2Server.GameplayServer.csproj
            assembly: Mgo2Server.GameplayServer
          - image: mgo2-http
            project: src/Http/Mgo2Server.Http.csproj
            assembly: Mgo2Server.Http
          - image: mgo2-dns
            project: src/Dns/Mgo2Server.Dns.csproj
            assembly: Mgo2Server.Dns
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The registry requires a lower-case path, and an owner may not be.
      - name: Resolve the image name
        id: image
        run: echo "value=${REGISTRY}/${GITHUB_REPOSITORY,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive the tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.value }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            PROJECT=${{ matrix.project }}
            ASSEMBLY=${{ matrix.assembly }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
