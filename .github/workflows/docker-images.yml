# Builds and publishes one container image per standalone server project. Every
# role is its own executable, so every role gets its own image and its own
# container; there is no combined image. The mgo2-postgres image is the custom
# PostgreSQL image that also carries the migration bundle and applies the schema
# on startup, before any server connects.
name: Docker images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Cancel in-progress runs for the same workflow, branch, and event.
# Only the most recent commit's run continues.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Resolve image configuration
        id: config
        shell: bash
        run: |
          case "${{ matrix.image }}" in
            mgo2-gate-lobby-server)
              echo "project=src/GateLobbyServer/Mgo2Server.GateLobbyServer.csproj" >> "$GITHUB_OUTPUT"
              echo "assembly=Mgo2Server.GateLobbyServer" >> "$GITHUB_OUTPUT"
              echo "target=runtime" >> "$GITHUB_OUTPUT"
              ;;
            mgo2-account-lobby-server)
              echo "project=src/AccountLobbyServer/Mgo2Server.AccountLobbyServer.csproj" >> "$GITHUB_OUTPUT"
              echo "assembly=Mgo2Server.AccountLobbyServer" >> "$GITHUB_OUTPUT"
              echo "target=runtime" >> "$GITHUB_OUTPUT"
              ;;
            mgo2-game-lobby-server)
              echo "project=src/GameLobbyServer/Mgo2Server.GameLobbyServer.csproj" >> "$GITHUB_OUTPUT"
              echo "assembly=Mgo2Server.GameLobbyServer" >> "$GITHUB_OUTPUT"
              echo "target=runtime" >> "$GITHUB_OUTPUT"
              ;;
            mgo2-gameplay-server)
              echo "project=src/GameplayServer/Mgo2Server.GameplayServer.csproj" >> "$GITHUB_OUTPUT"
              echo "assembly=Mgo2Server.GameplayServer" >> "$GITHUB_OUTPUT"
              echo "target=runtime" >> "$GITHUB_OUTPUT"
              ;;
            mgo2-http)
              echo "project=src/Http/Mgo2Server.Http.csproj" >> "$GITHUB_OUTPUT"
              echo "assembly=Mgo2Server.Http" >> "$GITHUB_OUTPUT"
              echo "target=runtime" >> "$GITHUB_OUTPUT"
              ;;
            mgo2-dns)
              echo "project=src/Dns/Mgo2Server.Dns.csproj" >> "$GITHUB_OUTPUT"
              echo "assembly=Mgo2Server.Dns" >> "$GITHUB_OUTPUT"
              echo "target=runtime" >> "$GITHUB_OUTPUT"
              ;;
            mgo2-stun)
              echo "project=src/Stun/Mgo2Server.Stun.csproj" >> "$GITHUB_OUTPUT"
              echo "assembly=Mgo2Server.Stun" >> "$GITHUB_OUTPUT"
              echo "target=runtime" >> "$GITHUB_OUTPUT"
              ;;
            mgo2-postgres)
              echo "target=postgres" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Mgo2Server.slnx

      - name: Build
        run: dotnet build Mgo2Server.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Mgo2Server.slnx --configuration Release --no-build


  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      images: ${{ github.ref_type == 'tag' && '["mgo2-gate-lobby-server","mgo2-account-lobby-server","mgo2-game-lobby-server","mgo2-gameplay-server","mgo2-http","mgo2-dns","mgo2-stun","mgo2-postgres"]' || steps.filter.outputs.changes }}
    steps:
      - name: Detect changed projects
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            mgo2-gate-lobby-server:
              - 'src/GateLobbyServer/**'
              - 'src/Shared/**'
              - 'Directory.Build.props'
              - 'Mgo2Server.slnx'
              - 'appsettings.example.json'
              - 'docker/Dockerfile'
            mgo2-account-lobby-server:
              - 'src/AccountLobbyServer/**'
              - 'src/Shared/**'
              - 'Directory.Build.props'
              - 'Mgo2Server.slnx'
              - 'appsettings.example.json'
              - 'docker/Dockerfile'
            mgo2-game-lobby-server:
              - 'src/GameLobbyServer/**'
              - 'src/Shared/**'
              - 'Directory.Build.props'
              - 'Mgo2Server.slnx'
              - 'appsettings.example.json'
              - 'docker/Dockerfile'
            mgo2-gameplay-server:
              - 'src/GameplayServer/**'
              - 'src/Shared/**'
              - 'Directory.Build.props'
              - 'Mgo2Server.slnx'
              - 'appsettings.example.json'
              - 'docker/Dockerfile'
            mgo2-http:
              - 'src/Http/**'
              - 'src/Shared/**'
              - 'Directory.Build.props'
              - 'Mgo2Server.slnx'
              - 'appsettings.example.json'
              - 'docker/Dockerfile'
            mgo2-dns:
              - 'src/Dns/**'
              - 'src/Shared/**'
              - 'Directory.Build.props'
              - 'Mgo2Server.slnx'
              - 'appsettings.example.json'
              - 'docker/Dockerfile'
            mgo2-stun:
              - 'src/Stun/**'
              - 'src/Shared/**'
              - 'Directory.Build.props'
              - 'Mgo2Server.slnx'
              - 'appsettings.example.json'
              - 'docker/Dockerfile'
            mgo2-postgres:
              - 'src/Shared/**'
              - 'Directory.Build.props'
              - 'Mgo2Server.slnx'
              - '.config/**'
              - 'docker/Dockerfile'
              - 'docker/entrypoint-postgres.sh'
              - 'docker/healthcheck-postgres.sh'

  images:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs:
      - test
      - changes
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # The registry requires a lower-case path, and an owner may not be.
      - name: Resolve the image name
        id: image
        run: echo "value=${REGISTRY}/${GITHUB_REPOSITORY,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive the tags and labels
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.value }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ steps.config.outputs.target }}
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            PROJECT=${{ steps.config.outputs.project }}
            ASSEMBLY=${{ steps.config.outputs.assembly }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
