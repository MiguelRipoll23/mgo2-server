# The rotation a local gameplay run is staged with.
#
# scripts/run-gameplay-local.sh reads this file when it exists, before it starts
# the server, and lets it name the rotation — so a rotation can be tried by
# editing this file instead of the script, and without touching the cluster. A
# name set here wins over the value the deployment carries; a name left out, or
# commented out, falls back to the run's own default.
#
# Rotation entries are comma separated, each `RULE@Map`, with an optional
# `:DREBIN` or `:HEADSHOTS` suffix. A game is at least two rounds, so a rotation
# names each round it plays and a single entry is refused at startup.

# Two rounds, TDM on Blood Bath: the shortest game a local run can play.
GAMEPLAY_SERVER_ROTATION='TDM@Blood Bath, TDM@Blood Bath'

# Two minutes and ten tickets for that TDM round. The bank is the lobby's
# seventeen words in order; only TDM's time (index 6) and ticket count (index 8)
# differ from the deployment's values.
GAMEPLAY_SERVER_RULE_TIMERS='5,2,5,2,5,2,2,2,10,5,30,5,2,5,2,5,2'
