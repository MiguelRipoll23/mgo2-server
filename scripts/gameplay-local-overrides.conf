# The rotation and the round a local gameplay run is staged with.
#
# scripts/run-gameplay-local.sh reads this file when it exists, before it starts
# the server, and lets it name the two settings — so a round can be tried by
# editing this file instead of the script, and without touching the cluster. A
# name set here wins over the value the deployment carries; a name left out, or
# commented out, falls back to the run's own default.
#
# Rotation entries are comma separated, each `RULE@Map`. The start round counts
# from 1, and is the room's place in the rotation it is playing.

# One round, TDM on Blood Bath: the default rotation of a local run.
GAMEPLAY_SERVER_ROTATION='TDM@Blood Bath'

# Start on round 5, the place the deployed room is staged at (CAP on Blood Bath).
GAMEPLAY_SERVER_START_ROUND=5
